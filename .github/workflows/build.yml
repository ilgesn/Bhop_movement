name: Build Minecraft Mod

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Clone the repository code onto the runner
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Set up the correct Java Version (Matching your build.gradle)
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'

    # 3. Grant execute permissions for the Gradle wrapper script
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    # 4. Compile the Java code and build the mod jar
    - name: Build with Gradle
      run: ./gradlew build

    # 5. Intercept the compiled .jar file and save it to the GitHub UI
    - name: Upload Compiled Mod Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Bhop-Movement-Jar
        path: build/libs/*.jar
